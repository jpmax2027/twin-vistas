<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Vistas — Spot the Difference</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header id="hud">
  <div class="brand">
    <h1>Twin Vistas</h1>
    <p id="round-name">Spot the Difference</p>
  </div>
  <div class="stat" id="found-stat">
    <span class="stat-label">Differences</span>
    <strong id="found-count">0 of 5 found</strong>
    <span id="to-go">5 to go</span>
  </div>
  <div class="stat" id="timer-stat">
    <span class="stat-label">Time</span>
    <strong id="clock">2:00</strong>
    <div id="timer-track"><div id="timer-bar"></div></div>
  </div>
  <div class="stat">
    <span class="stat-label">Score</span>
    <strong id="score">0</strong>
    <span id="streak"></span>
  </div>
  <nav class="actions">
    <button id="hint-btn" type="button">Hint (<span id="hints-left">3</span>)</button>
    <button id="pause-btn" type="button">Pause</button>
    <button id="restart-btn" type="button">Restart</button>
  </nav>
</header>

<main id="stage">
  <canvas id="board" width="1160" height="660"
    aria-label="Two nearly identical pictures side by side. Click a difference in either picture."></canvas>
  <div id="banner" hidden>
    <h2 id="banner-title">Twin Vistas</h2>
    <p id="banner-text"></p>
    <button id="banner-btn" type="button">Start</button>
  </div>
</main>

<footer id="help">
  <p>Click a difference in <em>either</em> picture. A wrong click costs 10 seconds.
     Keys: <kbd>H</kbd> hint &middot; <kbd>P</kbd> pause &middot; <kbd>R</kbd> restart &middot;
     <kbd>Enter</kbd> start / next scene.</p>
</footer>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
